<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARAL | رزرو نوبت</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f7f2f4;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:920px;margin:auto;padding:28px 18px 50px}.hero{text-align:center;padding:48px 10px 28px}
.logo{font:700 42px Georgia,serif;letter-spacing:5px;color:#f2b7c8}.sub{color:#cfc6ca;margin-top:10px;font-size:14px}
.tag{font-family:'Times New Roman',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:1px;font-size:21px;margin:24px 0 0;color:#e7d9de}.card{background:#141316;border:1px solid #2b272b;border-radius:24px;padding:24px;margin-top:20px;box-shadow:0 15px 50px #0008}
h2{font:700 22px Georgia,serif;margin:0 0 20px;color:#f2b7c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;color:#d9d0d4;font-size:13px;margin-bottom:7px}input,select{width:100%;padding:14px;border-radius:13px;border:1px solid #393338;background:#0e0d0f;color:#fff;font-size:15px;outline:none}
.full{grid-column:1/-1}.times{display:flex;flex-wrap:wrap;gap:9px}.time{border:1px solid #393338;background:#0e0d0f;color:#eee;border-radius:12px;padding:11px 16px;cursor:pointer}.time.active{background:#e6aabd;color:#171116;border-color:#e6aabd}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;background:#e6aabd;color:#171116;font-weight:700;font-size:16px;cursor:pointer}
.note{text-align:center;color:#aaa0a5;font-size:12px;margin-top:13px}.success{display:none;text-align:center;padding:25px}.success strong{color:#f2b7c8}.ig{display:inline-block;color:#f2b7c8;text-decoration:none;margin-top:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.logo{font-size:35px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="logo">MARAL</div>
    <div class="sub">HAIR ARTIST • HAIR STUDIO</div>
    <div class="tag">Your hair is my art</div>
  </section>

  <section class="card" id="booking">
    <h2>رزرو نوبت</h2>
    <div class="grid">
      <div><label>نام و نام خانوادگی</label><input id="name" placeholder="مثلاً مارال محمدی"></div>
      <div><label>شماره تماس</label><input id="phone" type="tel" placeholder="09xxxxxxxxx"></div>
      <div><label>خدمت</label>
        <select id="service">
          <option>کوتاهی مو</option><option>کوتاهی + براشینگ</option><option>استایل و براشینگ</option><option>مشاوره انتخاب مدل مو</option>
        </select>
      </div>
      <div><label>تاریخ</label><input id="date" type="date"></div>
      <div class="full"><label>ساعت موردنظر</label><div class="times" id="times"></div></div>
    </div>
    <button onclick="book()">ثبت درخواست نوبت</button>
    <div class="note">پس از ثبت، درخواست شما برای هماهنگی نهایی نمایش داده می‌شود.</div>
    <div class="success" id="success"></div>
  </section>

  <section class="card">
    <h2>خدمات</h2>
    <div class="grid">
      <div><b>کوتاهی مو</b><p class="sub">طراحی متناسب با فرم صورت و استایل شما</p></div>
      <div><b>کوتاهی + براشینگ</b><p class="sub">کات و استایل نهایی</p></div>
      <div><b>براشینگ</b><p class="sub">استایل حرفه‌ای مو</p></div>
      <div><b>مشاوره</b><p class="sub">انتخاب مدل مناسب مو</p></div>
    </div>
  </section>
</div>
<script>
const times=['10:00','11:30','13:00','14:30','16:00','17:30','19:00'];
let selected='';
const box=document.getElementById('times');

function loadTimes(){
  selected='';
  box.innerHTML='';
  const date=document.getElementById('date').value;

  if(!date){
    times.forEach(t=>addTimeButton(t,false));
    return;
  }

  const callbackName='byMaralAvailability_'+Date.now();
  window[callbackName]=function(data){
    try{
      const booked=Array.isArray(data.booked)?data.booked:[];
      times.forEach(t=>addTimeButton(t,booked.includes(t)));
    }finally{
      delete window[callbackName];
      const script=document.getElementById(callbackName);
      if(script) script.remove();
    }
  };

  const script=document.createElement('script');
  script.id=callbackName;
  script.src=GOOGLE_SCRIPT_URL+'?action=availability&date='+encodeURIComponent(date)+'&callback='+encodeURIComponent(callbackName);
  script.onerror=function(){
    delete window[callbackName];
    script.remove();
    times.forEach(t=>addTimeButton(t,false));
  };
  document.body.appendChild(script);
}

function addTimeButton(t,booked){
  const b=document.createElement('button');
  b.className='time';
  b.type='button';
  b.textContent=booked ? t+' (رزرو شده)' : t;
  b.disabled=booked;
  if(booked){
    b.style.opacity='.35';
    b.style.cursor='not-allowed';
  }else{
    b.onclick=()=>{
      selected=t;
      document.querySelectorAll('.time').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  }
  box.appendChild(b);
}

document.getElementById('date').addEventListener('change',loadTimes);
document.getElementById('date').min=new Date().toISOString().split('T')[0];

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXmK1YOEYR2RDkpm2lD9tMJsbV91zDA_-XAy4QW8SiohGwXM6VE0huPxGHsWU0fFWO/exec";

loadTimes();

async function book(){
 const n=document.getElementById('name').value.trim();
 const p=document.getElementById('phone').value.trim();
 const d=document.getElementById('date').value;
 const s=document.getElementById('service').value;
 const success=document.getElementById('success');
 const submitButton=document.querySelector('#booking > button');
 if(!n||!p||!d||!selected){alert('لطفاً نام، شماره تماس، تاریخ و ساعت را کامل انتخاب کنید.');return}
 if(d < new Date().toLocaleDateString('en-CA')){alert('لطفاً تاریخ امروز یا یک روز آینده را انتخاب کنید.');return}
 const payload={name:n,phone:p,service:s,date:d,time:selected};
 submitButton.disabled=true;
 submitButton.textContent='در حال ارسال...';
 try{
   await fetch(GOOGLE_SCRIPT_URL,{
     method:'POST',
     mode:'no-cors',
     headers:{'Content-Type':'text/plain;charset=utf-8'},
     body:JSON.stringify(payload)
   });
   success.style.display='block';
   success.replaceChildren();
   const title=document.createElement('strong');
   title.textContent='درخواست نوبت شما ارسال شد ✨';
   const details=document.createElement('p');
   details.textContent=n+' — '+s;
   const dateTime=document.createElement('p');
   dateTime.textContent=d+' — '+selected;
   const note=document.createElement('p');
   note.textContent='درخواست شما برای هماهنگی نهایی ثبت ارسال شده است؛ تا تأیید نهایی منتظر بمانید.';
   success.append(title,details,dateTime,note);
   submitButton.textContent='درخواست ارسال شد';
 }catch(error){
   alert('ارسال درخواست انجام نشد. اتصال اینترنت را بررسی کنید و دوباره امتحان کنید.');
   submitButton.disabled=false;
   submitButton.textContent='ثبت درخواست نوبت';
 }
}
</script>
</body>
</html>
